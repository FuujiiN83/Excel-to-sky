name: Bundle size diff

# Posts the per-PR bundle size delta against main so reviewers can catch
# accidental regressions (#231). The job runs the existing
# `scripts/check-bundle-size.mjs` audit on both the PR head and the merge
# base, then comments the diff back on the PR.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build PR head
        run: npm run build

      - name: Capture head sizes
        id: head
        run: |
          node scripts/check-bundle-size.mjs --max-route=999 --json > /tmp/head.json || true
          cat /tmp/head.json

      - name: Checkout main
        run: git checkout ${{ github.event.pull_request.base.sha }}

      - name: Install (main)
        run: npm ci

      - name: Build main
        run: npm run build

      - name: Capture base sizes
        id: base
        run: |
          node scripts/check-bundle-size.mjs --max-route=999 --json > /tmp/base.json || true
          cat /tmp/base.json

      - name: Compare and comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            let head, base
            try { head = JSON.parse(fs.readFileSync('/tmp/head.json', 'utf8')) } catch { head = {} }
            try { base = JSON.parse(fs.readFileSync('/tmp/base.json', 'utf8')) } catch { base = {} }
            const lines = ['### Bundle size diff', '', '| File | Base (kB) | PR (kB) | Δ (kB) |', '|---|---|---|---|']
            const names = new Set([...Object.keys(head ?? {}), ...Object.keys(base ?? {})])
            for (const name of [...names].sort()) {
              const a = base?.[name] ?? 0
              const b = head?.[name] ?? 0
              if (a === 0 && b === 0) continue
              lines.push(`| \`${name}\` | ${(a / 1024).toFixed(1)} | ${(b / 1024).toFixed(1)} | ${((b - a) / 1024).toFixed(1)} |`)
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join('\n'),
            })
