<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon variants (#257). The SVG handles every modern browser at any
         size; we reuse the existing PNG icon as apple-touch-icon (#255) since
         iOS still asks for a raster fallback for the home-screen tile. -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="mask-icon" href="/icons/favicon.svg" color="#4D9EFA" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Convierte tu Excel en un dashboard visual compartible. 100% local, sin cuenta." />

    <!-- Open Graph (#256). The default image is generated by the build step
         and served from /og-default.png. Share pages can override at runtime
         via #155's canvas generator. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Excel to Sky — Tus hojas de cálculo, en otra liga" />
    <meta property="og:description" content="Sube un Excel. Te devolvemos un dashboard navegable con stats, gráficos y un link para compartir. Cero instalación. Cero cuenta." />
    <meta property="og:image" content="/og-default.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Excel to Sky — dashboard visual generado desde un Excel." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-default.svg" />

    <title>Excel to Sky — Convierte tus Excels en dashboards</title>
    <!-- Funding Choices CMP — paste real snippet from AdSense console once approved -->
    <!-- <script async src="https://fundingchoicesmessages.google.com/i/pub-XXXX?ers=1"></script> -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
