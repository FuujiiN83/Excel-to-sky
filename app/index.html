<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Excel to Sky — Convierte tus Excels en dashboards</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Palette — light */
    --bg: #F7F6F2;
    --surface: #FFFFFF;
    --surface-2: #FBFAF7;
    --border: #ECE9E1;
    --border-strong: #D9D4C7;
    --ink: #14130F;
    --ink-2: #3A3833;
    --muted: #76726A;
    --muted-2: #A6A39B;

    /* Accents (Notion-y but punchy) */
    --sky: #2E6BFF;
    --sky-soft: #E4ECFF;
    --mint: #14B8A6;
    --mint-soft: #D7F5F0;
    --coral: #FF7159;
    --coral-soft: #FFE3DC;
    --plum: #8B5CF6;
    --plum-soft: #ECE3FF;
    --amber: #F5B100;
    --amber-soft: #FFF1C2;
    --rose: #EC4D7B;
    --rose-soft: #FCDEE7;
    --lime: #84CC16;
    --lime-soft: #EAF7CF;

    --radius-sm: 8px;
    --radius: 14px;
    --radius-lg: 22px;
    --radius-xl: 30px;

    --shadow-sm: 0 1px 0 rgba(20,19,15,0.04), 0 1px 2px rgba(20,19,15,0.04);
    --shadow: 0 1px 0 rgba(20,19,15,0.04), 0 8px 22px -10px rgba(20,19,15,0.10);
    --shadow-lg: 0 1px 0 rgba(20,19,15,0.04), 0 28px 60px -28px rgba(20,19,15,0.22);

    --font-display: "Bricolage Grotesque", ui-sans-serif, sans-serif;
    --font-ui: "Geist", ui-sans-serif, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, monospace;
  }

  /* Dark theme overrides */
  .theme-dark {
    --bg: #0F0F0E;
    --surface: #181816;
    --surface-2: #1F1F1C;
    --border: #2A2A26;
    --border-strong: #3A3A35;
    --ink: #F4F2EC;
    --ink-2: #D6D3CB;
    --muted: #8E8B82;
    --muted-2: #5E5C56;
    --sky-soft: #1B2A55;
    --mint-soft: #0F302C;
    --coral-soft: #3A1C16;
    --plum-soft: #2A1E4A;
    --amber-soft: #3A2D08;
    --rose-soft: #3A1422;
    --lime-soft: #1F2E0A;
    --shadow: 0 1px 0 rgba(0,0,0,0.4), 0 8px 22px -10px rgba(0,0,0,0.4);
    --shadow-lg: 0 1px 0 rgba(0,0,0,0.4), 0 28px 60px -28px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01", "cv11";
  }
  button { font-family: inherit; cursor: pointer; }
  ::selection { background: var(--ink); color: var(--bg); }

  /* Density */
  .density-compact { --pad: 14px; --pad-lg: 18px; --gap: 10px; }
  .density-cozy    { --pad: 20px; --pad-lg: 28px; --gap: 16px; }
  .density-airy    { --pad: 28px; --pad-lg: 40px; --gap: 22px; }

  #root { min-height: 100vh; }
</style>
</head>
<body class="density-cozy">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="charts.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
